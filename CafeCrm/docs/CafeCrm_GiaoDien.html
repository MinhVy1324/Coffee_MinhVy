<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phác thảo Cafe CRM</title><style>:root{--ink:#25332e;--green:#255c47;--light:#e9f1ec;--cream:#f6f5f1;--border:#dedfd8;--muted:#6f7973}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font:15px/1.55 system-ui,Segoe UI,sans-serif;color:var(--ink)}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--border);padding:30px 22px}.brand{font-size:28px;font-weight:800;letter-spacing:1px}.brand span{color:var(--green)}aside a{display:block;text-decoration:none;color:var(--ink);padding:12px 14px;border-radius:8px;margin:4px 0}aside a:hover{background:var(--light)}.workspace{font-size:11px;font-weight:700;letter-spacing:1.3px;margin:34px 0 12px;color:var(--muted)}.muted{color:var(--muted)}
.shell{margin-left:230px}header{height:76px;background:#fff;display:flex;align-items:center;gap:24px;padding:0 36px;border-bottom:1px solid var(--border)}header span:first-child{margin-right:auto;font-weight:600}header form{margin:0}main{padding:36px;max-width:1350px}h1{font-size:29px;line-height:1.3;margin:0 0 12px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px}.subtitle{color:var(--muted);margin:0 0 28px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.metric strong{display:block;font-size:34px;color:var(--green)}.metric .card{margin:0}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:24px 0}.toolbar input{max-width:270px}.toolbar label{min-width:120px}form{margin:0}.stack{max-width:660px}label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}input,select,textarea{font:inherit;border:1px solid #cbd1ca;border-radius:7px;padding:10px 12px;background:#fff;color:var(--ink);max-width:100%;width:100%}textarea{min-height:100px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;margin-right:9px}button,.button{font:600 14px system-ui;display:inline-block;border:0;border-radius:7px;padding:11px 17px;background:var(--green);color:#fff;cursor:pointer;text-decoration:none;margin-top:10px}.ghost{background:var(--light);color:var(--green)}.danger{background:#a94439}.inline{display:inline-block;margin:0 6px 0 0}.inline button{padding:7px 11px;font-size:12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}td small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:20px;padding:3px 10px;background:var(--light);color:var(--green);font-size:12px}.notice{padding:12px;background:var(--light);border-radius:6px}.error{color:#a94439}.bar{height:9px;max-width:250px;background:#e4e9e3;border-radius:8px;overflow:hidden}.bar span{height:100%;display:block;background:var(--green)}footer{padding:20px 36px;font-size:12px;color:var(--muted)}.check{font-weight:400;font-size:14px;display:flex;align-items:center}.question{border-top:1px solid var(--border);padding-top:20px;margin-top:20px}.empty{color:var(--muted);padding:25px;text-align:center}
@media(max-width:900px){aside{position:static;width:auto;padding:16px}aside a{display:inline-block}.workspace{margin:16px 0 0}.shell{margin:0}header{padding:16px;height:auto;flex-wrap:wrap}main{padding:22px}.grid{grid-template-columns:1fr}.card{overflow-x:auto}}

.prototype{background:#20382b;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:15px}.prototype button{margin:0;background:#e9f1ec;color:#20382b}.prototype span{margin-right:auto;font-size:13px}.prototype+aside{top:66px}header{height:72px}.phone{max-width:410px;margin:15px auto;background:#fff;padding:25px;border:9px solid #29362f;border-radius:32px}.phone .brand{font-size:20px}.phone .toolbar{display:flex;gap:6px}.phone h1{font-size:25px}.phone button{width:100%}.phone small{color:#6f7973}.navactive{background:#e9f1ec;color:#255c47}#toast{position:fixed;right:30px;bottom:30px;background:#255c47;color:white;padding:16px;border-radius:8px;display:none} .prototype-label{font-size:13px;color:#6f7973}
</style></head><body><div class="prototype"><span>PHÁC THẢO GIAO DIỆN · Dữ liệu minh họa · Các nút chỉ mô phỏng thao tác</span><button onclick="workspace('crm')">Web CRM</button><button onclick="workspace('admin')">Web Admin</button><button onclick="workspace('mobile')">App Android</button></div><aside id="side"></aside><div class="shell"><header><strong id="spaceTitle"></strong><span id="roleLabel"></span></header><main id="content"></main><footer>Đồ án CRM quán cà phê bằng C#</footer></div><div id="toast"></div><script>
const pages={
 dashboard:`<h1>Tổng quan khách hàng</h1><p class="subtitle">Chất lượng chăm sóc và mức độ tham gia khảo sát.</p><div class="grid metric"><div class="card">Khách đang hoạt động<strong>36</strong><small>Dữ liệu minh họa</small></div><div class="card">Phản hồi mới<strong>12</strong></div><div class="card">Hài lòng trung bình<strong>4,3 <small>/ 5</small></strong></div></div><div class="card"><h2>Khảo sát món mới</h2><p>Cold brew mùa thu · 24 lời mời · 18 người đã trả lời</p><div class="bar"><span style="width:75%"></span></div><p>Tỷ lệ tham gia 75%</p><button onclick="show('results')">Xem kết quả</button></div>`,
 customers:`<h1>Khách hàng</h1><p class="subtitle">Thông tin, sở thích và lịch sử chăm sóc.</p><div class="toolbar"><input placeholder="Tên, email hoặc số điện thoại"><button onclick="notify('Đã mô phỏng tìm kiếm khách hàng')">Tìm kiếm</button><button class="ghost" onclick="show('profile')">Thêm khách hàng</button></div><div class="card"><table><tr><th>Khách hàng</th><th>Liên hệ</th><th>Sở thích</th><th>Trạng thái</th><th></th></tr><tr><td>Nguyễn Minh Anh<small>minhanh@example.test</small></td><td>0901234567</td><td>Cà phê · Ít đường</td><td><span class="badge">Hoạt động</span></td><td><button class="ghost" onclick="show('profile')">Hồ sơ</button></td></tr><tr><td>Trần Hoài Nam<small>hoainam@example.test</small></td><td>0912345678</td><td>Trà</td><td><span class="badge">Hoạt động</span></td><td><button class="ghost" onclick="show('profile')">Hồ sơ</button></td></tr></table></div>`,
 profile:`<h1>Hồ sơ khách hàng</h1><div class="card stack"><label>Họ tên</label><input value="Nguyễn Minh Anh"><label>Email</label><input value="minhanh@example.test" readonly><label>Số điện thoại</label><input value="0901234567"><label>Ngày sinh</label><input type="date" value="2003-05-20"><label>Sở thích</label><label class="check"><input type="checkbox" checked>Cà phê</label><label class="check"><input type="checkbox">Trà</label><label class="check"><input type="checkbox" checked>Ít đường</label><button onclick="notify('Đã mô phỏng lưu hồ sơ')">Lưu thay đổi</button><button class="danger" onclick="notify('Đã mô phỏng khóa tài khoản')">Khóa tài khoản</button></div>`,
 feedback:`<h1>Phản hồi khách hàng</h1><p class="subtitle">Tiếp nhận, trả lời và ghi nhận kết quả xử lý.</p><div class="card"><h2>Nguyễn Minh Anh <span class="badge">Đang xử lý</span></h2><p>Cold brew · 4/5</p><p>Món ngon, tôi muốn có lựa chọn ít đá.</p><label>Trả lời</label><textarea placeholder="Nhập lời trả lời cho khách"></textarea><label>Trạng thái</label><select><option>Đang xử lý</option><option>Đã giải quyết</option><option>Đóng phản hồi</option></select><button onclick="notify('Đã mô phỏng gửi trả lời')">Gửi trả lời</button></div>`,
 surveys:`<h1>Khảo sát khách hàng</h1><button onclick="show('surveyedit')">Tạo khảo sát</button><div class="card"><h2>Cold brew mùa thu <span class="badge">Đang phát hành</span></h2><p>Thăm dò món mới · 4 câu hỏi · 24 lời mời</p><button class="ghost" onclick="show('results')">Xem kết quả</button><button class="ghost" onclick="notify('Đã mô phỏng đóng khảo sát')">Đóng khảo sát</button></div><div class="card"><h2>Trải nghiệm tại quán <span class="badge">Bản nháp</span></h2><button class="ghost" onclick="show('surveyedit')">Sửa bản nháp</button><button onclick="notify('Đã mô phỏng gửi lời mời vào tài khoản khách')">Phát hành và gửi</button></div>`,
 surveyedit:`<h1>Soạn khảo sát</h1><div class="card stack"><label>Tiêu đề</label><input value="Trải nghiệm tại quán"><label>Hạn trả lời theo giờ Việt Nam</label><input type="datetime-local"><h2>Câu 1</h2><input value="Ông đánh giá dịch vụ thế nào?"><label>Loại câu hỏi</label><select><option>Rating từ 1 đến 5</option><option>Chọn một</option><option>Chọn nhiều</option><option>Văn bản</option></select><label class="check"><input type="checkbox" checked>Bắt buộc trả lời</label><button onclick="notify('Đã mô phỏng lưu bản nháp')">Lưu bản nháp</button></div>`,
 results:`<h1>Kết quả khảo sát</h1><p class="subtitle">Cold brew mùa thu · dữ liệu minh họa</p><div class="grid metric"><div class="card">Lời mời<strong>24</strong></div><div class="card">Trả lời<strong>18</strong></div><div class="card">Tỷ lệ<strong>75%</strong></div></div><div class="card"><h2>Ông thích phiên bản nào?</h2><p>Cold brew cam · 12 lượt · 66,7%</p><div class="bar"><span style="width:66.7%"></span></div><p>Cold brew sữa · 6 lượt · 33,3%</p><div class="bar"><span style="width:33.3%"></span></div></div>`,
 reports:`<h1>Báo cáo khách hàng</h1><p class="subtitle">Cơ cấu tuổi và sở thích · dữ liệu minh họa</p><div class="card"><h2>Độ tuổi</h2><table><tr><th>Nhóm</th><th>Số khách</th><th>Tỷ lệ</th></tr><tr><td>18 đến 24</td><td>20</td><td>55,6%</td></tr><tr><td>25 đến 34</td><td>10</td><td>27,8%</td></tr><tr><td>Chưa cung cấp ngày sinh</td><td>6</td><td>16,7%</td></tr></table></div>`,
 users:`<h1>Quản trị tài khoản</h1><p class="subtitle">Giao diện Admin riêng, quản lý tài khoản và quyền.</p><div class="toolbar"><input placeholder="Tìm email"><button onclick="notify('Đã mô phỏng tìm kiếm')">Tìm kiếm</button></div><div class="card"><table><tr><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr><tr><td>manager@example.test</td><td>Manager</td><td>Hoạt động</td><td><button class="ghost" onclick="notify('Đã mô phỏng đổi vai trò')">Phân quyền</button></td></tr><tr><td>staff@example.test</td><td>Staff</td><td>Hoạt động</td><td><button class="ghost" onclick="notify('Đã mô phỏng vô hiệu hóa tài khoản')">Khóa hoặc xóa</button></td></tr></table></div>`,
 products:`<h1>Danh mục sản phẩm</h1><div class="toolbar"><input placeholder="Tên sản phẩm"><select><option>Tất cả nhóm</option><option>Cà phê</option></select><select><option>Tất cả nhà cung cấp</option><option>Nhà rang demo</option></select><input placeholder="Giá từ"><select><option>Tên</option><option>Giá tăng dần</option></select><button onclick="notify('Đã mô phỏng lọc danh mục')">Lọc</button></div><div class="card"><table><tr><th>Tên</th><th>Nhóm</th><th>Nhà cung cấp</th><th>Giá</th></tr><tr><td>Cà phê sữa</td><td>Cà phê</td><td>Nhà rang demo</td><td>35.000 đ</td></tr><tr><td>Cold brew</td><td>Cà phê</td><td>Nhà rang demo</td><td>45.000 đ</td></tr></table></div>`,
 suppliers:`<h1>Nhà cung cấp</h1><div class="toolbar"><input placeholder="Tên, email hoặc số điện thoại"><select><option>Tất cả trạng thái</option><option>Đang hợp tác</option></select><button onclick="notify('Đã mô phỏng tra cứu nhà cung cấp')">Tìm và lọc</button></div><div class="card"><h2>Nhà rang demo</h2><p>supplier@example.test · Đang hợp tác</p></div>`,
 mobile:`<p class="prototype-label">Phác thảo app Android cho khách hàng</p><div class="phone"><div class="brand">CAFE <span>CRM</span></div><h1>Khảo sát nhận được</h1><div class="toolbar"><button class="ghost" onclick="show('mobileprofile')">Hồ sơ</button><button class="ghost" onclick="show('mobilefeedback')">Góp ý</button></div><div class="card"><h2>Cold brew mùa thu</h2><p>Quán muốn nghe lựa chọn của ông.</p><small>Hạn trả lời được hiển thị tại đây.</small><button onclick="show('mobilesurvey')">Mở khảo sát</button></div><small>Mỗi khảo sát được trả lời một lần.</small></div>`,
 mobilesurvey:`<div class="phone"><div class="brand">CAFE <span>CRM</span></div><h1>Cold brew mùa thu</h1><h2>Ông thích phiên bản nào? *</h2><label class="check"><input type="radio" name="choice">Cold brew cam</label><label class="check"><input type="radio" name="choice">Cold brew sữa</label><h2>Độ hài lòng *</h2><select><option>Chọn điểm 1 đến 5</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Góp ý thêm</label><textarea></textarea><button onclick="notify('Đã mô phỏng gửi câu trả lời');show('mobile')">Gửi câu trả lời</button></div>`,
 mobileprofile:`<div class="phone"><div class="brand">CAFE <span>CRM</span></div><h1>Hồ sơ của tôi</h1><label>Họ tên</label><input value="Nguyễn Minh Anh"><label>Số điện thoại</label><input value="0901234567"><label>Ngày sinh</label><input type="date"><label>Sở thích</label><label class="check"><input type="checkbox" checked>Cà phê</label><label class="check"><input type="checkbox">Trà</label><button onclick="notify('Đã mô phỏng lưu hồ sơ')">Lưu hồ sơ</button><button class="ghost" onclick="show('mobile')">Khảo sát</button></div>`,
 mobilefeedback:`<div class="phone"><div class="brand">CAFE <span>CRM</span></div><h1>Góp ý cho quán</h1><label>Sản phẩm</label><select><option>Cold brew</option><option>Cà phê sữa</option><option>Dịch vụ chung</option></select><label>Đánh giá</label><select><option>5 / 5</option><option>4 / 5</option></select><label>Nội dung</label><textarea></textarea><button onclick="notify('Đã mô phỏng gửi phản hồi')">Gửi phản hồi</button><h2>Lịch sử phản hồi</h2><p>Quán trả lời sẽ hiển thị dưới từng góp ý.</p><button class="ghost" onclick="show('mobile')">Khảo sát</button></div>`
};
function show(key){document.getElementById('content').innerHTML=pages[key];document.querySelectorAll('#side a').forEach(x=>x.classList.toggle('navactive',x.dataset.key===key));}
function workspace(name){const config={crm:['NGHIỆP VỤ CRM','Quản lý', [['dashboard','Tổng quan'],['customers','Khách hàng'],['feedback','Phản hồi'],['surveys','Khảo sát'],['reports','Báo cáo']]],admin:['ADMIN HỆ THỐNG','Admin',[['users','Tài khoản và quyền'],['products','Sản phẩm'],['suppliers','Nhà cung cấp']]],mobile:['KHÁCH HÀNG ANDROID','Khách hàng',[['mobile','Khảo sát'],['mobileprofile','Hồ sơ'],['mobilefeedback','Góp ý']]]}[name];document.getElementById('side').innerHTML='<div class="brand">CAFE <span>CRM</span></div><div class="workspace">'+config[0]+'</div>'+config[2].map(([key,label])=>`<a href="#" data-key="${key}" onclick="show('${key}');return false">${label}</a>`).join('');document.getElementById('spaceTitle').textContent=config[0];document.getElementById('roleLabel').textContent=config[1];show(config[2][0][0]);}
let timer;function notify(message){clearTimeout(timer);const toast=document.getElementById('toast');toast.textContent=message;toast.style.display='block';timer=setTimeout(()=>toast.style.display='none',2500);}workspace('crm');
</script></body></html>
